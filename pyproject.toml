[project]
name = "trayguard"
version = "0.1.0"
description = "SPD training and assessment prototype for surgical tray instruments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cv2-enumerate-cameras>=1.3.3",
    "ffmpeg>=1.4",
    "hydra-core>=1.3.2",
    "ipykernel>=7.2.0",
    "kagglehub>=1.0.0",
    "omegaconf>=2.3.0",
    "streamlit>=1.56.0",
    "ultralytics>=8.4.21",
]

[project.scripts]
trayguard = "trayguard.cli:main"
trayguard-app = "trayguard.app.streamlit_runner:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
