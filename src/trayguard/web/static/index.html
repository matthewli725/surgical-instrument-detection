<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrayGuard Training</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">TrayGuard</p>
        <h1>Training Prototype</h1>
      </div>
      <div class="status" id="modeStatus">Loading</div>
    </header>

    <main class="shell">
      <nav class="steps" id="steps"></nav>
      <section class="workspace" id="app"></section>
    </main>

    <template id="tray-sort-template">
      <div class="split">
        <section>
          <h2 data-title></h2>
          <p class="muted" data-copy></p>
          <div class="camera-panel">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="snapshotCanvas"></canvas>
          </div>
          <div class="button-row">
            <button id="startCamera">Start camera</button>
            <button id="detectCards">Detect visible cards</button>
            <button id="submitSort" class="primary">Submit tray</button>
          </div>
          <div id="detectionSummary" class="notice"></div>
        </section>
        <aside>
          <h3>Manual fallback</h3>
          <div id="manualControls"></div>
          <label>Confidence
            <input id="confidence" type="range" min="1" max="5" value="3">
          </label>
          <label class="check"><input id="notSure" type="checkbox"> Not sure</label>
        </aside>
      </div>
    </template>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
