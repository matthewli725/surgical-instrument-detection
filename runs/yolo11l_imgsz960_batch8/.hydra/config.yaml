project_name: trayguard
task: detect
data:
  name: surgical_object_detection
  root: datasets/dataset_obj_detection
  yolo_data: ${data.root}/data.yaml
  num_classes: 4
  names:
  - Scalpel n4
  - Straight Dissection Clamp
  - Straight Mayo Scissor
  - Curved Mayo Scissor
model:
  name: yolo11l
  weights: yolo11l.pt
trainer:
  epochs: 100
  batch: 8
  imgsz: 960
  device: 0
  workers: 8
  patience: 20
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  weight_decay: 0.0005
  project: runs
  name: yolo11l_imgsz960_batch8
  pretrained: true
  save: true
  plots: true
  exist_ok: true
  verbose: true
  resume: false
  multi_scale: false
  deterministic: false
